# configs/mini_gpt.yaml
# Mini-GPT 训练配置文件 / Training Configuration File

# ============================================================
# 系统配置 / System Configuration
# ============================================================
system:
  out_dir: 'checkpoints/mini_gpt'
  device: 'auto'       # 'auto' | 'cuda' | 'cpu'
  resume: null         # checkpoint 路径, 留空则从头训练

# ============================================================
# 数据配置 / Data Configuration
# ============================================================
data:
  data_dir: 'data'
  data_file: 'wikitext103.bin'   # 训练数据文件名
  batch_size: 32                  # 每个 GPU 的 batch 大小
  num_workers: 0                  # DataLoader 工作进程数

# ============================================================
# 模型配置 / Model Configuration
# ============================================================
model:
  vocab_size: 50257               # 词表大小 (由 tokenizer 决定)
  block_size: 256                 # 最大上下文长度 / Max context length
  d_model: 768                    # 嵌入维度 / Embedding dimension
  n_layer: 6                      # Transformer 层数 / Number of layers
  n_head: 6                       # 注意力头数 / Number of attention heads
  dropout: 0.1                    # Dropout 比例
  bias: false                     # 是否使用偏置 (SwiGLU+RMSNorm 下不需要)
  pos_enc_type: 'rope'            # 位置编码: 'rope' | 'learned'
  norm_type: 'rmsnorm'            # 归一化: 'rmsnorm' | 'layernorm'
  ffn_type: 'swiglu'              # 前馈网络: 'swiglu' | 'gelu'

# ============================================================
# 优化器配置 / Optimizer Configuration
# ============================================================
optimizer:
  learning_rate: 3.0e-4           # 峰值学习率 / Peak learning rate
  weight_decay: 1.0e-2            # 权重衰减 (L2 正则化) / Weight decay
  beta1: 0.9                      # Adam beta1
  beta2: 0.95                     # Adam beta2
  gradient_accumulation_steps: 1  # 梯度累积步数: 1=不累积, >1=累积

# ============================================================
# 训练器配置 / Trainer Configuration
# ============================================================
trainer:
  max_iters: 20000                # 总训练步数 / Total training steps
  eval_interval: 1000             # 评估间隔 (步数) / Steps between evaluations
  eval_iters: 50                  # 每次评估的 batch 数 / Batches per evaluation
  warmup_iters: 100               # 预热步数 / Warmup steps
  min_lr: 1.0e-5                  # 最小学习率 (余弦衰减终点)

# ============================================================
# 混合精度训练 / Mixed Precision Training (AMP)
# ============================================================
amp:
  enabled: true                   # 开启混合精度 (需要 CUDA)
  dtype: 'bfloat16'               # 'float16' (需 GradScaler) | 'bfloat16' (推荐)

# ============================================================
# torch.compile 加速 / torch.compile Acceleration
# ============================================================
compile:
  enabled: true                   # 开启图编译加速 (需要 PyTorch 2.0+)
  mode: 'reduce-overhead'         # 'default' | 'reduce-overhead' | 'max-autotune'

# ============================================================
# 日志配置 / Logging Configuration
# ============================================================
logging:
  log_dir: 'logs'                 # 日志目录 / Log directory
  log_interval: 10                # TensorBoard 记录间隔 (步数)
