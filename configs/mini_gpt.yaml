# configs/mini_gpt.yaml

system:
  out_dir: 'checkpoints/mini_gpt'
  device: 'auto'
  resume: null  # null 在 python 中会被读作 None

data:
  data_dir: 'data'
  batch_size: 32
  num_workers: 0

model:
  vocab_size: 50257  # 这个通常由 tokenizer 决定，但可以在此占位
  block_size: 256
  d_model: 768
  n_layer: 6
  n_head: 6
  dropout: 0.1
  bias: true

optimizer:
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.95

trainer:
  max_iters: 20000
  eval_interval: 1000
  eval_iters: 50
